name: Daily Auto-Commit

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC every day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Generate, commit and push daily research
        run: |
          DATE=$(date -u '+%Y-%m-%d')
          FILE="daily-research/${DATE}.md"

          if [ -f "$FILE" ]; then
            echo "Today's file already exists — nothing to do."
            exit 0
          fi

          TOPICS=(
            "Multi-tenant data isolation strategies in SaaS"
            "JWT vs session-based authentication for SaaS platforms"
            "Role-Based Access Control (RBAC) design patterns"
            "Freemium pricing models for SMB SaaS products"
            "PostgreSQL row-level security for multi-tenancy"
            "Module-based SaaS architecture vs monolithic apps"
            "Subdomain-based tenant routing in web applications"
            "Refresh token rotation and security best practices"
            "SaaS onboarding UX — reducing time-to-value"
            "Audit logging patterns for compliance in SaaS"
            "Spring Boot multi-tenancy with Hibernate filters"
            "React dynamic routing based on feature flags"
            "SMB digitization trends in India 2024-2025"
            "Horizontal vs vertical SaaS — market positioning"
            "API rate limiting strategies for multi-tenant systems"
            "Soft delete vs hard delete in SaaS databases"
            "Tenant-scoped background jobs with Spring Scheduler"
            "Email deliverability best practices for SaaS"
            "GDPR and data residency considerations for SaaS"
            "Product-led growth vs sales-led growth for SaaS startups"
            "Database connection pooling in multi-tenant Spring Boot apps"
            "Webhook design patterns for SaaS integrations"
            "Feature flag systems for gradual module rollouts"
            "SaaS churn analysis — common causes and prevention"
            "Microservices vs modular monolith for early-stage SaaS"
            "Tenant billing and usage metering architecture"
            "Zero-downtime database migrations in SaaS"
            "Search and filtering at scale in multi-tenant SaaS"
            "Customer support ticket lifecycle in HelpDesk SaaS"
            "Inventory management data models for SMB platforms"
          )

          SOURCES=(
            "https://aws.amazon.com/blogs/apn/multi-tenancy-isolation-strategies/ | https://www.postgresql.org/docs/current/ddl-schemas.html"
            "https://jwt.io/introduction | https://owasp.org/www-community/attacks/Session_hijacking_attack"
            "https://dl.acm.org/doi/10.1145/234313.234412 | https://csrc.nist.gov/publications/detail/sp/800-162/final"
            "https://openviewpartners.com/product-benchmarks/ | https://www.priceintelligently.com/blog/saas-pricing-models"
            "https://www.postgresql.org/docs/current/ddl-rowsecurity.html | https://supabase.com/docs/guides/auth/row-level-security"
            "https://martinfowler.com/articles/modularizing-react-apps.html | https://www.oreilly.com/library/view/building-microservices/9781491950340/"
            "https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Host | https://nginx.org/en/docs/http/server_names.html"
            "https://auth0.com/blog/refresh-tokens-what-are-they-and-when-to-use-them/ | https://owasp.org/www-project-top-ten/"
            "https://www.appcues.com/blog/saas-onboarding | https://www.intercom.com/blog/onboarding-users/"
            "https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html | https://www.ibm.com/topics/audit-trail"
            "https://spring.io/blog/2022/07/31/how-to-integrate-hibernates-multitenant-feature-with-spring-data-jpa | https://hibernate.org/orm/documentation/"
            "https://reactrouter.com/en/main | https://martinfowler.com/articles/feature-toggles.html"
            "https://nasscom.in/knowledge-center/publications/sme-digital-adoption-report | https://msme.gov.in/sites/default/files/MSME-AR-2023-24-Eng.pdf"
            "https://www.christenseninstitute.org/theory/jobs-to-be-done/ | https://a16z.com/2020/02/18/marketplace-100/"
            "https://cloud.google.com/architecture/rate-limiting-strategies-techniques | https://stripe.com/blog/rate-limiters"
            "https://www.postgresql.org/docs/current/sql-update.html | https://martinfowler.com/bliki/SoftDelete.html"
            "https://docs.spring.io/spring-framework/reference/integration/scheduling.html | https://www.baeldung.com/spring-scheduled-tasks"
            "https://sendgrid.com/blog/email-deliverability-best-practices/ | https://www.mailgun.com/blog/deliverability/email-deliverability-guide/"
            "https://gdpr.eu/what-is-gdpr/ | https://cloud.google.com/privacy/gdpr"
            "https://openviewpartners.com/product-led-growth/ | https://www.productled.org/foundations/what-is-product-led-growth"
            "https://www.baeldung.com/spring-boot-hikari | https://github.com/brettwooldridge/HikariCP"
            "https://stripe.com/docs/webhooks | https://docs.github.com/en/developers/webhooks-and-events/webhooks/about-webhooks"
            "https://martinfowler.com/articles/feature-toggles.html | https://launchdarkly.com/blog/what-are-feature-flags/"
            "https://www.profitwell.com/recur/all/saas-churn-rate | https://baremetrics.com/academy/churn"
            "https://martinfowler.com/articles/modular-monolith-primer.html | https://microservices.io/patterns/monolithic.html"
            "https://stripe.com/docs/billing/subscriptions/overview | https://www.chargebee.com/resources/guides/saas-billing/"
            "https://www.liquibase.org/blog/zero-downtime-deployments | https://flywaydb.org/documentation/concepts/migrations"
            "https://www.elastic.co/guide/en/elasticsearch/reference/current/multi-tenancy.html | https://www.postgresql.org/docs/current/indexes.html"
            "https://www.zendesk.com/blog/ticketing-system/ | https://developer.zendesk.com/documentation/ticketing/tickets/ticket-lifecycle/"
            "https://www.postgresql.org/docs/current/tutorial-sql.html | https://martinfowler.com/eaaCatalog/repository.html"
          )

          DOY=$(date -u '+%j' | sed 's/^0*//')
          INDEX=$(( (DOY - 1) % ${#TOPICS[@]} ))
          TOPIC="${TOPICS[$INDEX]}"
          SOURCE_LINE="${SOURCES[$INDEX]}"

          PROMPT="You are a SaaS technical researcher. Write a concise research note (180-220 words) on: ${TOPIC}, specifically for building a multi-tenant SaaS platform for SMBs. Structure: 1) One-line key insight. 2) Exactly 4 bullet points of actionable technical findings. 3) One concrete real-world example with a specific metric or data point. Use plain text only, no markdown headers or bold."

          RESPONSE=$(curl -s https://api.groq.com/openai/v1/chat/completions \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg prompt "$PROMPT" '{model:"llama3-8b-8192",messages:[{role:"user",content:$prompt}],max_tokens:400,temperature:0.7}')")

          echo "Groq HTTP status check:"
          echo "$RESPONSE" | jq -r '.error.message // "No error — key OK"'

          NOTE=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // "Research generation failed — check GROQ_API_KEY secret."')

          {
            echo "# Research: ${TOPIC}"
            echo ""
            echo "**Date:** ${DATE}"
            echo "**Model:** Groq API — llama3-8b-8192"
            echo ""
            echo "---"
            echo ""
            echo "## Research Note"
            echo ""
            echo "${NOTE}"
            echo ""
            echo "---"
            echo ""
            echo "## Proof Sources"
            echo ""
            echo "$SOURCE_LINE" | tr '|' '\n' | sed 's/^ */- /'
            echo ""
            echo "---"
            echo ""
            echo "*Auto-generated by [daily-auto-commit.yml](.github/workflows/daily-auto-commit.yml)*"
          } > "$FILE"

          # Update README index
          if ! grep -q "${DATE}" daily-research/README.md; then
            python3 -c "
import re, sys
content = open('daily-research/README.md').read()
new_row = '| [${DATE}](${DATE}.md) | ${TOPIC} |'
# Find last table row and insert after it
lines = content.splitlines()
last_table = max((i for i, l in enumerate(lines) if l.startswith('|')), default=None)
if last_table is not None:
    lines.insert(last_table + 1, new_row)
else:
    lines.append(new_row)
open('daily-research/README.md', 'w').write('\n'.join(lines) + '\n')
"
          fi

          git config user.name  "Varadha9"
          git config user.email "varadmandhare924@gmail.com"
          git pull --rebase origin main
          git add daily-research/
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "research: daily note — ${DATE}"
          git push
        env:
          GROQ_API_KEY: ${{ secrets.DAILY_RESEARCH }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
